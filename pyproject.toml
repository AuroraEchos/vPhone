[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vphone"
version = "0.1.0.dev0"
description = "Hybrid Android agent runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "android: requires an authorized Android device",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
